name: Build SourceMod Connector/C Release

on:
  push:
    tags:
      - 'v*-sm.*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_flags: -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
            packages: gcc-multilib libc6-dev-i386 libssl-dev:i386 zlib1g-dev:i386
          - arch: x86_64
            cmake_flags: ''
            packages: libssl-dev zlib1g-dev
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then
            dpkg --add-architecture i386
          fi
          apt-get update
          apt-get install -y ${{ matrix.packages }}

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          release_tag='${{ github.ref_name }}'
          version=${release_tag#v}
          version=${version%-sm.*}
          package="mariadb-connector-c-${version}-${{ matrix.arch }}"
          archive="mariadb-connector-c-${version}-linux-${{ matrix.arch }}.tar.gz"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DINSTALL_LIBDIR=lib \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_CURL=OFF \
            -DWITH_SSL=OPENSSL \
            -DWITH_EXTERNAL_ZLIB=ON \
            -DCLIENT_PLUGIN_CACHING_SHA2_PASSWORD=STATIC \
            ${{ matrix.cmake_flags }}
          cmake --build build --parallel --target mariadbclient
          cmake --install build --component Development

          test -f stage/lib/libmariadbclient.a
          test -f stage/include/mariadb/mysql.h
          mv stage "$package"
          tar -czf "$archive" "$package"
          tar -tzf "$archive" | grep -Fx "$package/lib/libmariadbclient.a"
          mkdir release
          mv "$archive" release/

      - uses: actions/upload-artifact@v7
        with:
          name: sourcemod-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator_arch: Win32
          - arch: x86_64
            generator_arch: x64
    steps:
      - uses: actions/checkout@v6

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = '${{ github.ref_name }}'
          $version = ($releaseTag -replace '^v', '') -replace '-sm\..+$', ''
          $package = "mariadb-connector-c-$version-${{ matrix.arch }}"
          $archive = "mariadb-connector-c-$version-windows-${{ matrix.arch }}.zip"

          cmake -S . -B build -G 'Visual Studio 17 2022' -A '${{ matrix.generator_arch }}' `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" `
            -DINSTALL_LIBDIR=lib `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_CURL=OFF `
            -DWITH_SSL=SCHANNEL `
            -DCLIENT_PLUGIN_CACHING_SHA2_PASSWORD=STATIC
          cmake --build build --config Release --parallel --target mariadbclient
          cmake --install build --config Release --component Development
          New-Item -ItemType Directory -Force -Path "$package/lib/debug" | Out-Null
          Copy-Item stage/include "$package/include" -Recurse
          Copy-Item stage/lib/mariadbclient.lib "$package/lib/mariadbclient.lib"

          cmake --build build --config Debug --parallel --target mariadbclient
          $debugLibrary = Get-ChildItem -Recurse -Filter mariadbclient.lib -LiteralPath build |
            Where-Object { $_.Directory.Name -eq 'Debug' } |
            Select-Object -First 1
          if ($null -eq $debugLibrary) { throw 'Debug static library was not built.' }
          Copy-Item $debugLibrary.FullName "$package/lib/debug/mariadbclient.lib"

          if (-not (Test-Path "$package/include/mariadb/mysql.h")) { throw 'MariaDB headers were not installed.' }
          if (-not (Test-Path "$package/lib/mariadbclient.lib")) { throw 'Release static library was not installed.' }
          if (-not (Test-Path "$package/lib/debug/mariadbclient.lib")) { throw 'Debug static library was not installed.' }
          Compress-Archive -Path $package -DestinationPath $archive
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Move-Item $archive release/

      - uses: actions/upload-artifact@v7
        with:
          name: sourcemod-windows-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v6

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          release_tag='${{ github.ref_name }}'
          version=${release_tag#v}
          version=${version%-sm.*}
          package="mariadb-connector-c-${version}-x86_64"
          archive="mariadb-connector-c-${version}-macos-x86_64.tar.gz"
          openssl_root=$(brew --prefix openssl@3)

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DINSTALL_LIBDIR=lib \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_CURL=OFF \
            -DWITH_SSL=OPENSSL \
            -DOPENSSL_ROOT_DIR="$openssl_root" \
            -DCLIENT_PLUGIN_CACHING_SHA2_PASSWORD=STATIC
          cmake --build build --parallel --target mariadbclient
          cmake --install build --component Development

          test -f stage/lib/libmariadbclient.a
          test -f stage/include/mariadb/mysql.h
          mv stage "$package"
          tar -czf "$archive" "$package"
          tar -tzf "$archive" | grep -Fx "$package/lib/libmariadbclient.a"
          mkdir release
          mv "$archive" release/

      - uses: actions/upload-artifact@v7
        with:
          name: sourcemod-macos-x86_64
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sourcemod-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          test $(wc -l < SHA256SUMS) -eq 5

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
