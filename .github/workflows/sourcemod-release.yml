name: Build SourceMod Connector/C Release

on:
  push:
    tags:
      - 'v*-sm.*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    # Debian 13, like our servers: links its OpenSSL 3, which the SourceMod build there links too.
    container: ghcr.io/alliedmodders/build-containers/debian13-clang22:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_flags: -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
            packages: cmake ninja-build gcc-multilib libc6-dev-i386 libssl-dev:i386 zlib1g-dev:i386
          - arch: x86_64
            cmake_flags: ''
            packages: cmake ninja-build libssl-dev zlib1g-dev
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then
            dpkg --add-architecture i386
          fi
          apt-get update
          apt-get install -y ${{ matrix.packages }}

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          release_tag='${{ github.ref_name }}'
          version=${release_tag#v}
          version=${version%-sm.*}
          package="mariadb-connector-c-${version}-${{ matrix.arch }}"
          archive="mariadb-connector-c-${version}-linux-${{ matrix.arch }}.tar.gz"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DINSTALL_LAYOUT=DEFAULT \
            -DINSTALL_LIBDIR=lib \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_CURL=OFF \
            -DWITH_SSL=OPENSSL \
            -DWITH_EXTERNAL_ZLIB=ON \
            -DCLIENT_PLUGIN_CACHING_SHA2_PASSWORD=STATIC \
            ${{ matrix.cmake_flags }}
          cmake --build build --parallel --target mariadbclient
          # The Development component also installs libmariadb.so, which is not
          # built for these static-only artifacts. Run the generated header-only
          # install script, then copy the static target explicitly.
          cmake -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DCMAKE_INSTALL_COMPONENT=Development \
            -P build/include/cmake_install.cmake
          mkdir -p stage/lib
          cp build/libmariadb/libmariadbclient.a stage/lib/

          test -f stage/lib/libmariadbclient.a
          test -f stage/include/mariadb/mysql.h
          mv stage "$package"
          tar -czf "$archive" "$package"
          tar -tzf "$archive" | grep -Fx "$package/lib/libmariadbclient.a"
          mkdir release
          mv "$archive" release/

      - uses: actions/upload-artifact@v7
        with:
          name: sourcemod-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            dev_arch: x86
          - arch: x86_64
            dev_arch: x64
    steps:
      - uses: actions/checkout@v6

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'No Visual Studio installation with x86/x64 C++ tools was found.' }
          $devCmd = Join-Path $vsRoot 'Common7\Tools\VsDevCmd.bat'
          cmd /d /s /c "`"$devCmd`" -arch=${{ matrix.dev_arch }} -host_arch=x64 >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                Set-Item -Path ("Env:" + $matches[1]) -Value $matches[2]
              }
            }

          $releaseTag = '${{ github.ref_name }}'
          $version = ($releaseTag -replace '^v', '') -replace '-sm\..+$', ''
          $package = "mariadb-connector-c-$version-${{ matrix.arch }}"
          $archive = "mariadb-connector-c-$version-windows-${{ matrix.arch }}.zip"

          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" `
            -DINSTALL_LIBDIR=lib `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_CURL=OFF `
            -DWITH_SSL=SCHANNEL `
            -DCLIENT_PLUGIN_CACHING_SHA2_PASSWORD=STATIC
          cmake --build build-release --parallel --target mariadbclient
          cmake --install build-release --component Development
          New-Item -ItemType Directory -Force -Path "$package/lib/debug" | Out-Null
          Copy-Item stage/include "$package/include" -Recurse
          Copy-Item stage/lib/mariadbclient.lib "$package/lib/mariadbclient.lib"

          cmake -S . -B build-debug -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DINSTALL_LIBDIR=lib `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_CURL=OFF `
            -DWITH_SSL=SCHANNEL `
            -DCLIENT_PLUGIN_CACHING_SHA2_PASSWORD=STATIC
          cmake --build build-debug --parallel --target mariadbclient
          $debugLibrary = Get-ChildItem -Recurse -Filter mariadbclient.lib -LiteralPath build-debug |
            Select-Object -First 1
          if ($null -eq $debugLibrary) { throw 'Debug static library was not built.' }
          Copy-Item $debugLibrary.FullName "$package/lib/debug/mariadbclient.lib"

          if (-not (Test-Path "$package/include/mariadb/mysql.h")) { throw 'MariaDB headers were not installed.' }
          if (-not (Test-Path "$package/lib/mariadbclient.lib")) { throw 'Release static library was not installed.' }
          if (-not (Test-Path "$package/lib/debug/mariadbclient.lib")) { throw 'Debug static library was not installed.' }
          Compress-Archive -Path $package -DestinationPath $archive
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Move-Item $archive release/

      - uses: actions/upload-artifact@v7
        with:
          name: sourcemod-windows-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sourcemod-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          test $(wc -l < SHA256SUMS) -eq 4

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
